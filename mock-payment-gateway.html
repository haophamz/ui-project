<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Thanh Toán Giả Lập</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f1f5f9;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .gateway-card {
            border-radius: 1rem;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
        .theme-momo {
            background-color: #a50064;
            color: white;
        }
        .theme-vnpay {
            background-color: #005baa;
            color: white;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card gateway-card overflow-hidden bg-white">
                    <!-- Dynamic Header -->
                    <div class="p-4 text-center" id="gateway-header">
                        <h3 class="fw-bold m-0" id="gateway-title">CỔNG THANH TOÁN</h3>
                    </div>

                    <!-- Payment Details -->
                    <div class="p-4">
                        <div class="text-center mb-4">
                            <span class="text-muted d-block small">SỐ TIỀN CẦN THANH TOÁN</span>
                            <h2 class="fw-bold text-dark mt-1" id="gateway-amount">0đ</h2>
                        </div>

                        <div class="border-top border-bottom py-3 mb-4">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Đơn vị thụ hưởng:</span>
                                <span class="fw-semibold">BookShop Online</span>
                            </div>
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted">Mã yêu cầu (RequestID):</span>
                                <span class="fw-semibold text-monospace" id="gateway-request-id">TX_...</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted">Phương thức:</span>
                                <span class="fw-semibold text-uppercase" id="gateway-method">...</span>
                            </div>
                        </div>

                        <!-- Info Alerts -->
                        <div class="alert alert-info py-2 px-3 small mb-4">
                            <i class="bi bi-info-circle-fill me-2"></i> Đây là trang <strong>giả lập thanh toán</strong> phục vụ cho mục đích phát triển UI/UX (đồ án). Hãy chọn kịch bản kết quả bên dưới để kiểm tra luồng callback của hệ thống.
                        </div>

                        <!-- Action buttons simulating Gateway outcomes -->
                        <div class="d-grid gap-2">
                            <button onclick="simulateCallback(true)" class="btn btn-success py-2 fw-bold">
                                <i class="bi bi-check-lg me-1"></i> GIẢ LẬP THANH TOÁN THÀNH CÔNG
                            </button>
                            <button onclick="simulateCallback(false)" class="btn btn-danger py-2 fw-bold">
                                <i class="bi bi-x-lg me-1"></i> GIẢ LẬP GIAO DỊCH THẤT BẠI / HUỶ
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom logic for mock callback redirect -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const requestId = urlParams.get('requestId') || 'TX_' + Date.now();
            const amount = parseInt(urlParams.get('amount') || '0');
            const method = urlParams.get('method') || 'momo';

            document.getElementById('gateway-request-id').textContent = requestId;
            document.getElementById('gateway-amount').textContent = `${amount.toLocaleString('vi-VN')}đ`;
            document.getElementById('gateway-method').textContent = method.toUpperCase();

            const headerEl = document.getElementById('gateway-header');
            const titleEl = document.getElementById('gateway-title');

            if (method.toLowerCase() === 'momo') {
                headerEl.className = 'p-4 text-center theme-momo';
                titleEl.innerHTML = '<i class="bi bi-wallet2 me-2"></i> Ví MoMo Giả Lập';
            } else {
                headerEl.className = 'p-4 text-center theme-vnpay';
                titleEl.innerHTML = '<i class="bi bi-bank me-2"></i> Cổng VNPAY Giả Lập';
            }
        });

        function simulateCallback(isSuccess) {
            // After clicking, simulate redirecting back to our website callback pages
            const urlParams = new URLSearchParams(window.location.search);
            const requestId = urlParams.get('requestId');
            
            if (isSuccess) {
                // Redirect to success page
                window.location.href = `payment-success.html?requestId=${requestId}&status=00`;
            } else {
                // Redirect to failure page
                window.location.href = `payment-failure.html?requestId=${requestId}&status=99`;
            }
        }
    </script>
</body>
</html>
