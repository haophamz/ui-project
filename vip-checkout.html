<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận đăng ký VIP - BookShop</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        .custom-payment-option {
            display: flex;
            align-items: center;
            padding: 1.25rem;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }
        
        .custom-payment-option:hover {
            border-color: var(--border-hover);
            background: rgba(255, 255, 255, 0.05);
        }
        
        .form-check-input {
            margin-top: 0;
            cursor: pointer;
        }

        .form-check-input:checked + .custom-payment-option {
            border-color: var(--primary);
            background: rgba(30, 206, 155, 0.04);
            box-shadow: 0 0 15px var(--primary-glow);
        }
    </style>
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100" style="background: radial-gradient(circle at top, #1e3a8a 0%, #09090b 70%);">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary border-opacity-10 py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold text-highlight" href="index.html">
                <i class="bi bi-book-half"></i> BookShop
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Trang chủ</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Quay lại trang chủ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <h2 class="fw-bold mb-4" style="font-family: var(--font-outfit);"><i class="bi bi-credit-card-2-front text-highlight"></i> Xác Nhận Đăng Ký Hội Viên</h2>
                
                <div class="glass-card p-4 mb-4 border border-secondary border-opacity-25 bg-black bg-opacity-20 shadow-lg">
                    <h5 class="fw-bold border-bottom border-secondary border-opacity-10 pb-2 mb-3 text-white">Tóm tắt đơn hàng</h5>
                    <div class="row mb-3">
                        <div class="col-6 text-muted">Sản phẩm đăng ký:</div>
                        <div class="col-6 text-end fw-bold text-white" id="checkout-package-name">Gói 6 Tháng (Mẫu)</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6 text-muted">Thời hạn gói:</div>
                        <div class="col-6 text-end fw-bold text-white" id="checkout-package-duration">180 ngày</div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-6 text-muted">Đơn giá:</div>
                        <div class="col-6 text-end text-white" id="checkout-package-price">499,000đ</div>
                    </div>
                    <hr class="border-secondary border-opacity-10">
                    <div class="row fs-5 fw-bold text-highlight mt-2">
                        <div class="col-6">Tổng thanh toán:</div>
                        <div class="col-6 text-end" id="checkout-total-amount">499,000đ</div>
                    </div>
                </div>

                <!-- Payment Methods Card -->
                <div class="glass-card p-4 border border-secondary border-opacity-25 bg-black bg-opacity-20 shadow-lg">
                    <h5 class="fw-bold border-bottom border-secondary border-opacity-10 pb-2 mb-3 text-white">Chọn phương thức thanh toán</h5>
                    <form id="checkout-payment-form" action="/payment/process" method="POST">
                        <!-- MoMo Option -->
                        <div class="position-relative mb-3">
                            <input class="form-check-input position-absolute top-50 start-0 translate-middle-y ms-3 z-3" type="radio" name="paymentMethod" id="method-momo" value="momo" required>
                            <label class="custom-payment-option ps-5" for="method-momo">
                                <span class="fs-5 fw-bold flex-grow-1 text-white">Ví điện tử MoMo</span>
                                <span class="badge bg-danger text-white px-3 py-2 rounded">MOMO</span>
                            </label>
                        </div>
                        
                        <!-- VNPAY Option -->
                        <div class="position-relative mb-4">
                            <input class="form-check-input position-absolute top-50 start-0 translate-middle-y ms-3 z-3" type="radio" name="paymentMethod" id="method-vnpay" value="vnpay">
                            <label class="custom-payment-option ps-5" for="method-vnpay">
                                <span class="fs-5 fw-bold flex-grow-1 text-white">Cổng thanh toán VNPAY</span>
                                <span class="badge bg-primary text-white px-3 py-2 rounded">VNPAY</span>
                            </label>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="index.html#packages" class="text-muted text-decoration-none small"><i class="bi bi-chevron-left"></i> Thay đổi gói VIP</a>
                            <button type="submit" class="btn btn-waka px-5 py-3 fw-bold shadow-lg">Xác nhận thanh toán</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark bg-opacity-40 border-top border-secondary border-opacity-10 py-4 mt-auto">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 BookShop. Giao diện được thiết kế tối ưu cho đồ án.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- No custom JS files needed for static HTML -->
</body>
</html>
