<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận đăng ký VIP - BookShop</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3" href="index.html">
                <i class="bi bi-book-half"></i> BookShop
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Trang chủ</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="auth-nav-container">
                    <!-- Dynamic Auth State rendered by js/app.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <h2 class="fw-bold mb-4"><i class="bi bi-credit-card-2-front text-primary"></i> Xác Nhận Đăng Ký Hội Viên VIP</h2>
                
                <div class="card p-4 shadow-sm mb-4 bg-white">
                    <h5 class="fw-bold border-bottom pb-2 mb-3">Tóm tắt đơn hàng</h5>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Sản phẩm đăng ký:</div>
                        <div class="col-6 text-end fw-bold" id="checkout-package-name">Gói VIP...</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Thời hạn gói:</div>
                        <div class="col-6 text-end fw-bold" id="checkout-package-duration">... ngày</div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6 text-muted">Đơn giá:</div>
                        <div class="col-6 text-end" id="checkout-package-price">...đ</div>
                    </div>
                    <hr>
                    <div class="row fs-5 fw-bold text-primary">
                        <div class="col-6">Tổng số tiền cần thanh toán:</div>
                        <div class="col-6 text-end" id="checkout-total-amount">...đ</div>
                    </div>
                </div>

                <div class="card p-4 shadow-sm bg-white">
                    <h5 class="fw-bold border-bottom pb-2 mb-3">Chọn phương thức thanh toán</h5>
                    <form id="checkout-payment-form">
                        <!-- MoMo -->
                        <div class="form-check border p-3 rounded mb-3 d-flex align-items-center">
                            <input class="form-check-input ms-1" type="radio" name="paymentMethod" id="method-momo" value="momo" required>
                            <label class="form-check-label ms-3 d-flex align-items-center w-100" for="method-momo">
                                <span class="fs-5 fw-bold flex-grow-1">Ví điện tử MoMo</span>
                                <span class="badge bg-danger-subtle text-danger px-2 py-1">MoMo</span>
                            </label>
                        </div>
                        
                        <!-- VNPAY -->
                        <div class="form-check border p-3 rounded mb-4 d-flex align-items-center">
                            <input class="form-check-input ms-1" type="radio" name="paymentMethod" id="method-vnpay" value="vnpay">
                            <label class="form-check-label ms-3 d-flex align-items-center w-100" for="method-vnpay">
                                <span class="fs-5 fw-bold flex-grow-1">Cổng thanh toán VNPAY</span>
                                <span class="badge bg-primary-subtle text-primary px-2 py-1">VNPAY</span>
                            </label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="index.html#packages" class="btn btn-outline-secondary px-4 py-2">Quay lại</a>
                            <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">Xác nhận thanh toán</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-top py-4 mt-auto">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 BookShop. Giao diện thiết kế cho đồ án TMDT.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
