<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang cá nhân & Lịch sử giao dịch - BookShop</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100" style="background: radial-gradient(circle at top, #111827 0%, #09090b 100%);">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary border-opacity-10 py-3 sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3 fw-bold text-highlight" href="index.html">
                <i class="bi bi-book-half"></i> BookShop
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Trang chủ</a>
                    </li>
                </ul>
                <ul class="navbar-nav" id="auth-nav-container">
                    <!-- Dynamic Auth State rendered by js/app.js -->
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container py-5">
        <div class="row">
            <!-- Left Side: User Info -->
            <div class="col-md-4 mb-4">
                <div class="glass-card p-4 text-center border-secondary border-opacity-25 bg-black bg-opacity-20 shadow-lg">
                    <div class="mb-3">
                        <i class="bi bi-person-badge-fill text-highlight" style="font-size: 4.5rem; filter: drop-shadow(0 0 10px var(--primary-glow));"></i>
                    </div>
                    <h4 class="fw-bold mb-1 text-white" id="profile-name" style="font-family: var(--font-outfit);">...</h4>
                    <p class="text-muted small mb-4" id="profile-email">...</p>
                    
                    <hr class="border-secondary border-opacity-15">
                    
                    <div class="mb-2">
                        <span class="text-muted d-block small mb-2 uppercase fw-semibold">LOẠI TÀI KHOẢN</span>
                        <div id="profile-vip-status">
                            <!-- Populated dynamically by profile.js -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Transaction History -->
            <div class="col-md-8">
                <div class="glass-card p-4 border-secondary border-opacity-25 bg-black bg-opacity-20 shadow-lg">
                    <h4 class="fw-bold border-bottom border-secondary border-opacity-10 pb-3 mb-4 text-white" style="font-family: var(--font-outfit);">
                        <i class="bi bi-clock-history text-highlight"></i> Lịch Sử Giao Dịch Đăng Ký VIP
                    </h4>
                    
                    <div class="table-responsive">
                        <table class="table waka-table table-hover align-middle m-0">
                            <thead>
                                <tr>
                                    <th scope="col">Mã giao dịch</th>
                                    <th scope="col">Gói dịch vụ</th>
                                    <th scope="col">Số tiền</th>
                                    <th scope="col">Hình thức</th>
                                    <th scope="col">Ngày giao dịch</th>
                                    <th scope="col">Trạng thái</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-history-body">
                                <!-- Populated dynamically by profile.js -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark bg-opacity-40 border-top border-secondary border-opacity-10 py-4 mt-auto">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 BookShop. Bản quyền giao diện thuộc về đồ án TMDT.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
