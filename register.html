<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebook - Đăng ký</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="book-particle" style="left: 10%; animation-delay: 0s;">📖</div>
    <div class="book-particle" style="left: 25%; animation-delay: 4s;">📚</div>
    <div class="book-particle" style="left: 40%; animation-delay: 8s;">📕</div>
    <div class="book-particle" style="left: 60%; animation-delay: 2s;">📗</div>
    <div class="book-particle" style="left: 75%; animation-delay: 6s;">📘</div>
    <div class="book-particle" style="left: 85%; animation-delay: 12s;">📙</div>

    <div class="container">
        <div class="logo">Ebook</div>
        <h1>Đăng ký tài khoản</h1>
        
        <form id="registerForm">
            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="fullName" placeholder="Nguyễn Văn A" required>
            </div>
            
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com" required>
                <div class="error" id="emailError">Email đã được sử dụng</div>
            </div>
            
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="form-group">
                <label>Xác nhận mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="••••••••" required>
            </div>
            
            <div class="checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="margin-bottom: 0; font-weight: 500;">Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a></label>
            </div>
            
            <button type="submit">Đăng ký</button>
        </form>
        
        <div class="success" id="successMessage">
            ✅ Đăng ký thành công! Đang chuyển hướng...
        </div>
        
        <div class="link">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
