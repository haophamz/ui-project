<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký - BookShop</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white d-flex flex-column min-vh-100" style="background: radial-gradient(circle at center, #111827 0%, #09090b 100%);">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary border-opacity-10 py-3">
        <div class="container text-center">
            <a class="navbar-brand fs-3 fw-bold mx-auto text-highlight" href="index.html">
                <i class="bi bi-book-half"></i> BookShop
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="glass-card p-5 shadow-lg border border-secondary border-opacity-25 bg-black bg-opacity-30">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle fs-1 text-highlight"></i>
                        <h3 class="fw-bold mt-3 text-white" id="form-title" style="font-family: var(--font-outfit);">Đăng Nhập Tài Khoản</h3>
                        <p class="text-muted small" id="form-subtitle">Chào mừng bạn trở lại với kho sách</p>
                    </div>
                    
                    <form id="login-form">
                        <div class="mb-3">
                            <label for="email" class="form-label text-muted small fw-semibold">ĐỊA CHỈ EMAIL</label>
                            <input type="email" class="form-control form-control-dark" id="email" required placeholder="name@example.com" value="demomember@gmail.com">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label text-muted small fw-semibold">MẬT KHẨU</label>
                            <input type="password" class="form-control form-control-dark" id="password" required placeholder="••••••••" value="123456">
                        </div>
                        <button type="submit" class="btn btn-waka w-100 py-3 fw-bold">ĐĂNG NHẬP</button>
                    </form>

                    <div class="text-center mt-4 border-top border-secondary border-opacity-10 pt-3">
                        <span class="text-muted small">Chưa có tài khoản?</span>
                        <a href="#" id="toggle-form-link" class="text-highlight small text-decoration-none ms-1">Đăng ký ngay</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark bg-opacity-40 border-top border-secondary border-opacity-10 py-4 mt-auto">
        <div class="container text-center">
            <p class="text-muted mb-0">&copy; 2026 BookShop. Bản quyền giao diện thuộc về đồ án TMDT.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const returnUrl = urlParams.get('returnUrl') || 'index.html';
            const isRegister = urlParams.get('register') === 'true';

            const formTitle = document.getElementById('form-title');
            const formSubtitle = document.getElementById('form-subtitle');
            const toggleLink = document.getElementById('toggle-form-link');
            const form = document.getElementById('login-form');

            let mode = isRegister ? 'register' : 'login';

            function updateUI() {
                if (mode === 'register') {
                    formTitle.textContent = 'Đăng Ký Tài Khoản';
                    formSubtitle.textContent = 'Trở thành thành viên BookShop hôm nay';
                    toggleLink.textContent = 'Đã có tài khoản? Đăng nhập';
                } else {
                    formTitle.textContent = 'Đăng Nhập Tài Khoản';
                    formSubtitle.textContent = 'Chào mừng bạn trở lại với kho sách';
                    toggleLink.textContent = 'Chưa có tài khoản? Đăng ký ngay';
                }
            }

            updateUI();

            toggleLink.addEventListener('click', (e) => {
                e.preventDefault();
                mode = mode === 'login' ? 'register' : 'login';
                updateUI();
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // Call our mockLogin inside app.js
                const success = mockLogin(email, password);
                if (success) {
                    alert(mode === 'login' ? 'Đăng nhập thành công!' : 'Đăng ký và Đăng nhập thành công!');
                    // Redirect back to return URL
                    window.location.href = returnUrl;
                } else {
                    alert('Đăng nhập thất bại!');
                }
            });
        });
    </script>
</body>
</html>
