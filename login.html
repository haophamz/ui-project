<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ebook - Đăng nhập</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="book-particle" style="left: 8%; animation-delay: 0s;">📖</div>
    <div class="book-particle" style="left: 22%; animation-delay: 3s;">📚</div>
    <div class="book-particle" style="left: 45%; animation-delay: 7s;">📕</div>
    <div class="book-particle" style="left: 65%; animation-delay: 1s;">📗</div>
    <div class="book-particle" style="left: 80%; animation-delay: 5s;">📘</div>

    <div class="container">
        <div class="logo">Ebook</div>
        <h1>Đăng nhập</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <div class="checkbox">
                <label style="display: flex; align-items: center; margin-bottom: 0;">
                    <input type="checkbox"> Ghi nhớ tôi
                </label>
                <a href="#" style="color: #2563eb; text-decoration: none; font-weight: 500;">Quên mật khẩu?</a>
            </div>
            
            <button type="submit">Đăng nhập</button>
        </form>
        
        <div class="error" id="loginError">
            ❌ Sai email hoặc mật khẩu
        </div>
        
        <div class="link">
            Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
